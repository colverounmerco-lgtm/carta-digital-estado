<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicio temporalmente no disponible — Carta Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFF7ED;
    font-family: Inter, sans-serif;
    padding: 1.5rem;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 20px;
    padding: 2.25rem 1.75rem;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  .icono {
    font-size: 2.75rem;
    margin-bottom: 0.75rem;
  }
  h1 {
    font-size: 1.3rem;
    color: #1C1C1E;
    margin: 0 0 0.75rem;
  }
  p {
    font-size: 0.95rem;
    color: #4B5563;
    line-height: 1.55;
    margin: 0 0 0.75rem;
  }
  .destacado {
    background: #FFF7ED;
    border: 1.5px solid #FDBA74;
    border-radius: 12px;
    padding: 0.9rem 1rem;
    font-size: 0.9rem;
    color: #9A3412;
    font-weight: 600;
    margin-top: 1.25rem;
  }
  .marca {
    margin-top: 1.75rem;
    font-size: 0.78rem;
    color: #9CA3AF;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icono">🍽️</div>
    <h1>El menú digital no está disponible por unos minutos</h1>
    <p>Estamos teniendo un problema técnico temporal y ya estamos trabajando para solucionarlo.</p>
    <div class="destacado">Pídele el menú y toma tu pedido directamente con el mesero mientras tanto 🙌</div>
    <div class="marca">Carta Digital</div>
  </div>
  <script>
    // Si el sitio principal ya volvió, redirige solo.
    setInterval(function () {
      fetch("https://cartasdigital.com/", { mode: "no-cors", cache: "no-store" })
        .then(function () { window.location.href = "https://cartasdigital.com/"; })
        .catch(function () {});
    }, 15000);
  </script>
</body>
</html>
